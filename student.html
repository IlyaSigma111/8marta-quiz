<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Участник - Весенний кахут</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comfortaa', cursive;
            background: linear-gradient(135deg, #fbc7d1 0%, #f8cdda 100%);
            color: #4a4a4a;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 3px solid white;
            border-radius: 50px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(220, 90, 120, 0.2);
        }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        h1 { 
            font-size: 2.2rem; 
            text-align: center; 
            margin-bottom: 25px;
            color: #b33b5c;
        }
        
        .logo { 
            font-size: 70px; 
            text-align: center; 
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px #ffb6c1);
        }
        
        input {
            width: 100%;
            padding: 18px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #d44e6c;
            border-radius: 40px;
            color: #4a4a4a;
            font-size: 1.1rem;
            font-family: 'Comfortaa', cursive;
            margin: 10px 0;
        }
        
        input:focus {
            outline: none;
            box-shadow: 0 0 30px #ffb6c1;
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #d44e6c;
            border-radius: 40px;
            color: #b33b5c;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: 'Comfortaa', cursive;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #fff0f5;
            box-shadow: 0 0 30px #ffb6c1;
            transform: translateY(-3px);
        }
        
        .info-box {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid white;
            border-radius: 30px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(212, 78, 108, 0.2);
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .question-header {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid white;
            border-radius: 30px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            color: #b33b5c;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 1.6rem;
            margin: 30px 0;
            text-align: center;
            line-height: 1.5;
            color: #4a4a4a;
            font-weight: 600;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }
        
        .option {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid white;
            border-radius: 40px;
            padding: 18px 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }
        
        .option:hover {
            background: rgba(255, 240, 245, 0.8);
            box-shadow: 0 0 25px #ffb6c1;
            transform: translateX(5px);
        }
        
        .option.selected {
            background: #fff0f5;
            border-color: #d44e6c;
        }
        
        .option-letter {
            width: 45px;
            height: 45px;
            background: #d44e6c;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.3rem;
        }
        
        .status {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            border-radius: 40px;
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .status.correct { 
            background: rgba(160, 220, 160, 0.3);
            border: 2px solid #6b8e4c;
            color: #2d5a27;
        }
        
        .status.wrong { 
            background: rgba(255, 160, 160, 0.3);
            border: 2px solid #d44e6c;
            color: #b33b5c;
        }
        
        .status.waiting {
            background: rgba(255, 240, 200, 0.3);
            border: 2px solid #f0b27a;
            color: #b35e2e;
        }
        
        .error {
            background: rgba(255, 100, 100, 0.2);
            border: 2px solid #ff6b6b;
            color: #b33b5c;
            padding: 15px;
            border-radius: 30px;
            margin: 10px 0;
            text-align: center;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(212, 78, 108, 0.2);
            border-top: 4px solid #d44e6c;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .player-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
            font-size: 1.2rem;
        }
        
        .player-stats span {
            color: #b33b5c;
            font-weight: 700;
            font-size: 1.5rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .question-text {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ЭКРАН ВХОДА -->
        <div id="joinScreen" class="screen active">
            <div class="logo">🌸</div>
            <h1>ВЕСЕННИЙ КАХУТ</h1>
            <div id="errorContainer"></div>
            <input type="text" id="playerName" placeholder="Твоё имя" maxlength="15">
            <input type="text" id="gameCode" placeholder="Код викторины" maxlength="8" inputmode="numeric" pattern="[0-9]*">
            <button id="joinButton" class="btn">🌷 ПОДКЛЮЧИТЬСЯ</button>
            <a href="index.html" class="btn" style="text-align: center;">← На главную</a>
        </div>

        <!-- ЭКРАН ОЖИДАНИЯ -->
        <div id="waitingScreen" class="screen">
            <div class="logo">⏳</div>
            <h2 style="text-align: center; margin-bottom: 20px; color: #b33b5c;">ОЖИДАНИЕ...</h2>
            <div class="loader"></div>
            <div class="info-box">
                <div class="info-item">
                    <span>Участник:</span>
                    <strong id="displayName">-</strong>
                </div>
                <div class="info-item">
                    <span>Код:</span>
                    <strong id="displayCode">-</strong>
                </div>
                <div class="info-item">
                    <span>Очки:</span>
                    <strong id="displayScore">0</strong>
                </div>
            </div>
            <button onclick="leaveGame()" class="btn">🚪 ВЫЙТИ</button>
        </div>

        <!-- ЭКРАН ВОПРОСА -->
        <div id="questionScreen" class="screen">
            <div class="question-header">
                <span>🌸 8 МАРТА</span>
                <span id="questionCounter">1/30</span>
            </div>
            
            <div class="question-text" id="questionText">
                Загрузка вопроса...
            </div>
            
            <div class="options" id="optionsContainer">
                <!-- Варианты загрузятся через JS -->
            </div>
            
            <div class="status waiting" id="answerStatus">
                ⏳ Выбери вариант ответа
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        // ============================================
        // student.js - 8 МАРТА
        // ============================================

        // Проверка загрузки вопросов
        console.log("🔍 Проверка QUIZ_DATA:", window.QUIZ_DATA);
        
        if (!window.QUIZ_DATA) {
            document.body.innerHTML = '<div style="color:#b33b5c; padding:50px; font-size:1.5rem; text-align:center;">❌ ОШИБКА: вопросы не загружены</div>';
            throw new Error("QUIZ_DATA не найден");
        }

        // Глобальные переменные
        let currentGameId = null;
        let playerName = null;
        let currentQuestion = null;
        let hasAnswered = false;
        let gameListener = null;

        // Элементы DOM
        const joinScreen = document.getElementById('joinScreen');
        const waitingScreen = document.getElementById('waitingScreen');
        const questionScreen = document.getElementById('questionScreen');
        const joinButton = document.getElementById('joinButton');
        const errorContainer = document.getElementById('errorContainer');
        const playerNameInput = document.getElementById('playerName');
        const gameCodeInput = document.getElementById('gameCode');
        const displayName = document.getElementById('displayName');
        const displayCode = document.getElementById('displayCode');
        const displayScore = document.getElementById('displayScore');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const answerStatus = document.getElementById('answerStatus');
        const questionCounter = document.getElementById('questionCounter');

        // Показать ошибку
        function showError(message) {
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => { errorContainer.innerHTML = ''; }, 3000);
        }

        // Переключить экран
        function switchScreen(screenName) {
            [joinScreen, waitingScreen, questionScreen].forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenName + 'Screen').classList.add('active');
        }

        // Сбросить состояние вопроса
        function resetQuestionState() {
            hasAnswered = false;
            currentQuestion = null;
            questionText.textContent = 'Загрузка вопроса...';
            optionsContainer.innerHTML = '';
            answerStatus.textContent = '⏳ Выбери вариант ответа';
            answerStatus.className = 'status waiting';
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
        }

        // Подключиться к игре
        function joinGame() {
            const name = playerNameInput.value.trim();
            const code = gameCodeInput.value.trim();
            
            if (!name || name.length < 2) {
                showError("Введите имя (минимум 2 символа)");
                return;
            }
            
            if (!code || code.length !== 8 || !/^\d+$/.test(code)) {
                showError("Введите 8 цифр кода викторины");
                return;
            }
            
            playerName = name;
            currentGameId = "game_" + code;
            
            joinButton.disabled = true;
            joinButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ПОДКЛЮЧЕНИЕ...';
            
            db.ref(`games/${currentGameId}`).once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    throw new Error(`Викторина с кодом ${code} не найдена`);
                }
                
                const game = snapshot.val();
                
                if (game.players && game.players[name]) {
                    throw new Error("Участник с таким именем уже есть");
                }
                
                return db.ref(`games/${currentGameId}/players/${name}`).set({
                    name: name,
                    joined: Date.now(),
                    score: 0,
                    device: /Mobi|Android/i.test(navigator.userAgent) ? "📱 Телефон" : "💻 Компьютер"
                });
            }).then(() => {
                console.log("✅ Подключен к игре:", currentGameId);
                
                displayName.textContent = playerName;
                displayCode.textContent = code;
                
                switchScreen('waiting');
                listenToGame();
                
                joinButton.disabled = false;
                joinButton.innerHTML = '🌷 ПОДКЛЮЧИТЬСЯ';
                
            }).catch(error => {
                showError(error.message);
                joinButton.disabled = false;
                joinButton.innerHTML = '🌷 ПОДКЛЮЧИТЬСЯ';
            });
        }

        // Слушать изменения в игре
        function listenToGame() {
            if (!currentGameId) return;
            
            if (gameListener) {
                db.ref(`games/${currentGameId}`).off('value', gameListener);
            }
            
            gameListener = db.ref(`games/${currentGameId}`).on('value', snapshot => {
                const game = snapshot.val();
                if (!game) {
                    console.log("Игра удалена");
                    leaveGame();
                    return;
                }
                
                if (game.players && game.players[playerName]) {
                    displayScore.textContent = game.players[playerName].score || 0;
                }
                
                const currentQuestionId = game.currentQuestion;
                
                if (game.status === "question_active" && currentQuestionId) {
                    
                    const question = QUIZ_DATA.questions.find(q => q.id === currentQuestionId);
                    
                    if (question) {
                        if (!currentQuestion || currentQuestion.id !== question.id) {
                            console.log("📌 Новый вопрос:", question.id);
                            resetQuestionState();
                            currentQuestion = question;
                            displayQuestion(question);
                        }
                    }
                }
            });
        }

        // Показать вопрос
        function displayQuestion(question) {
            switchScreen('question');
            
            questionText.textContent = question.text;
            questionCounter.textContent = `${question.id}/30`;
            
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.dataset.index = index;
                optionDiv.innerHTML = `
                    <div class="option-letter">${String.fromCharCode(65 + index)}</div>
                    <div>${option}</div>
                `;
                
                optionDiv.addEventListener('click', () => selectAnswer(index));
                optionsContainer.appendChild(optionDiv);
            });
        }

        // Выбрать ответ
        function selectAnswer(answerIndex) {
            if (hasAnswered) {
                return;
            }
            
            if (!currentQuestion || !currentGameId || !playerName) {
                return;
            }
            
            hasAnswered = true;
            
            document.querySelectorAll('.option').forEach((opt, idx) => {
                opt.classList.remove('selected');
                if (idx === answerIndex) {
                    opt.classList.add('selected');
                }
            });
            
            const isCorrect = (answerIndex === currentQuestion.correct);
            
            db.ref(`games/${currentGameId}/answers/${currentQuestion.id}/${playerName}`).set({
                answerIndex: answerIndex,
                isCorrect: isCorrect,
                timestamp: Date.now()
            }).then(() => {
                if (isCorrect) {
                    db.ref(`games/${currentGameId}/players/${playerName}/score`).transaction(score => {
                        return (score || 0) + (currentQuestion.points || 1);
                    });
                }
                
                answerStatus.textContent = isCorrect ? "✅ ПРАВИЛЬНО!" : "❌ НЕПРАВИЛЬНО";
                answerStatus.className = isCorrect ? "status correct" : "status wrong";
                
                console.log(`📊 Ответ: ${isCorrect ? '✅' : '❌'}`);
                
            }).catch(error => {
                console.error("Ошибка отправки ответа:", error);
                showError("Ошибка при отправке ответа");
                hasAnswered = false;
            });
        }

        // Выйти из игры
        function leaveGame() {
            if (currentGameId && playerName) {
                db.ref(`games/${currentGameId}/players/${playerName}`).remove();
            }
            
            if (gameListener && currentGameId) {
                db.ref(`games/${currentGameId}`).off('value', gameListener);
            }
            
            currentGameId = null;
            playerName = null;
            currentQuestion = null;
            hasAnswered = false;
            gameListener = null;
            
            playerNameInput.value = '';
            gameCodeInput.value = '';
            
            resetQuestionState();
            switchScreen('join');
        }

        // Валидация ввода кода
        gameCodeInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').substring(0, 8);
        });

        playerNameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                gameCodeInput.focus();
            }
        });

        gameCodeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                joinGame();
            }
        });

        joinButton.addEventListener('click', joinGame);

        window.leaveGame = leaveGame;
        window.selectAnswer = selectAnswer;

        document.addEventListener('DOMContentLoaded', function() {
            console.log("✅ Student panel загружен");
            playerNameInput.focus();
        });
    </script>
</body>
</html>
